<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<style>
		.bg {
			fill: #080809;
		}
		.frame {
			fill: none;
			stroke: rgba(244, 244, 241, 0.28);
			stroke-width: 2;
		}
		.glyph {
			fill: #f4f4f1;
		}
		@media (prefers-color-scheme: light) {
			.bg {
				fill: #f5f4f0;
			}
			.frame {
				stroke: rgba(12, 12, 14, 0.28);
			}
			.glyph {
				fill: #0c0c0e;
			}
		}
	</style>
	<rect class="bg" width="64" height="64" rx="8" />
	<rect class="frame" x="2" y="2" width="60" height="60" rx="6" />
	<text
		class="glyph"
		x="20"
		y="44"
		text-anchor="middle"
		font-family="Georgia, 'Times New Roman', serif"
		font-style="italic"
		font-size="36"
	>
		S
	</text>
	<text
		class="glyph"
		x="44"
		y="43"
		text-anchor="middle"
		font-family="system-ui, -apple-system, sans-serif"
		font-weight="800"
		font-size="32"
	>
		Z
	</text>
</svg>
